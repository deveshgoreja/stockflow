name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Lint and test (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://stockflow:stockflow@localhost:5432/stockflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Full test suite
        run: pytest -v
      - name: Concurrency suite, repeated to catch flaky races
        run: for run in 1 2 3; do pytest tests/concurrency -q || exit 1; done

  frontend:
    name: Build dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack from .env.example
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: API is healthy and serves docs
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -o /dev/null http://localhost:8000/docs
      - name: Seed demo data
        run: docker compose exec -T api python -m scripts.seed
      - name: Dashboard is served
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:5173 && exit 0
            sleep 2
          done
          exit 1
      - name: Report shows seeded data
        run: curl -fsS http://localhost:8000/reports/summary
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
